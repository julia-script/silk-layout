name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SILK_VERSION: 0.1.0-dev.20+10a8c67813a1
      SILK_HOME: ${{ github.workspace }}/.cache/silk
      SILK_CLANG: /usr/bin/clang-22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .cache/silk
          key: silk-dev20-10a8c67813a1-x86_64-linux
      - name: Install LLVM 22
        run: |
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-22
      - name: Install and verify published Silk
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$SILK_HOME/toolchains/$SILK_VERSION"
          if [[ ! -f "$toolchain/bin/silkc" ]]; then
            asset="silk-$SILK_VERSION-x86_64-unknown-linux-gnu.tar.gz"
            curl --fail --location --silent --show-error "https://github.com/silk-lang/silk/releases/download/v${SILK_VERSION/+/%2B}/${asset/+/%2B}" -o "$RUNNER_TEMP/silk.tar.gz"
            echo "f2ae1338d78871d511a40ca358b00c985594a3d4b555e22ccc01c8ca723d02b9  $RUNNER_TEMP/silk.tar.gz" | sha256sum -c -
            mkdir -p "$toolchain"
            tar -xzf "$RUNNER_TEMP/silk.tar.gz" --strip-components=1 -C "$toolchain"
          fi
          echo "f81c8f8d35082e6f283022ce6f3e08f65dfd4a502d34f75bc3bcd8efaeeaab4f  $toolchain/bin/silkc" | sha256sum -c -
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Native checks, tests and adapter scenarios
        run: scripts/check
      - name: Browser differential and seeded fuzz
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/chrome-diff.mjs --cli build/llvm/x86_64-unknown-linux-gnu/debug/silk_layout_cli --fuzz 200 --seed "$GITHUB_RUN_NUMBER" > .cache/differential.json
      - name: Benchmark observations
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled()
        run: python3 scripts/bench.py --cli build/llvm/x86_64-unknown-linux-gnu/debug/silk_layout_cli
      - uses: actions/upload-artifact@v4
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: differential-failures
          path: |
            .cache/differential.json
            .cache/chrome-diff/
          retention-days: 7
