name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SILK_VERSION: 0.1.0-dev.28+14bcdaa837f3
      SILK_HOME: ${{ github.workspace }}/.cache/silk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .cache/silk
          key: silk-dev26-430d979004dc-x86_64-linux
      - uses: actions/cache@v4
        with:
          path: .cache/llvm-22.1.8
          key: llvm-22.1.8-linux-x64-clang
      - name: Install LLVM 22 clang
        run: echo "SILK_CLANG=$(LLVM_HOME=.cache/llvm-22.1.8 scripts/install-llvm)" >> "$GITHUB_ENV"
      - name: Install and verify published Silk
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$SILK_HOME/toolchains/$SILK_VERSION"
          if [[ ! -f "$toolchain/bin/silkc" ]]; then
            asset="silk-$SILK_VERSION-x86_64-unknown-linux-gnu.tar.gz"
            curl --fail --location --silent --show-error "https://github.com/silk-lang/silk/releases/download/v${SILK_VERSION/+/%2B}/${asset/+/%2B}" -o "$RUNNER_TEMP/silk.tar.gz"
            echo "75fe93848a539c4f32ef6df87cc292a72a879d761d68d92c848cf23fa7c91fbe  $RUNNER_TEMP/silk.tar.gz" | sha256sum -c -
            mkdir -p "$toolchain"
            tar -xzf "$RUNNER_TEMP/silk.tar.gz" --strip-components=1 -C "$toolchain"
          fi
          echo "7a7c49563252f364dc9aa4b036c7fd5c979d9ee40f24cc8e4279261e8c2a16bf  $toolchain/bin/silkc" | sha256sum -c -
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Native checks, tests and adapter scenarios
        run: scripts/check
      - name: Browser differential and seeded fuzz
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/chrome-diff.mjs --cli build/llvm/x86_64-unknown-linux-gnu/debug/silk_layout_cli --fuzz 200 --seed "$GITHUB_RUN_NUMBER" > .cache/differential.json
      - name: Benchmark observations
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled()
        run: python3 scripts/bench.py --cli build/llvm/x86_64-unknown-linux-gnu/debug/silk_layout_cli
      - uses: actions/upload-artifact@v4
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: differential-failures
          path: |
            .cache/differential.json
            .cache/chrome-diff/
          retention-days: 7
