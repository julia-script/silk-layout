<!doctype html>
<meta charset="utf-8">
<title>Original flex fragmentation probes (MIT)</title>
<style>
  body { margin: 0; font: 14px monospace; }
  .probe { columns: 2; column-gap: 0; column-fill: auto; width: 200px; height: 50px; margin-bottom: 100px; }
  .flex { display: flex; align-items: flex-start; }
  .item { width: 50px; flex: none; }
  .twenty { height: 20px; }
</style>
<script>
// Original black-box probes. §10 is normative; §10.1's exact algorithms are
// informative. CSSWG #6812 resolves global alignment and independently
// fragmentable margins; #6855 permits independent, non-monolithic columns.
// Observations do not stand in for page/variable-frame tests. In particular,
// Chrome's trailing-margin overflow and visibility:collapse behavior are not
// adopted by the spec fixtures.
const cases = [
  {name: 'parallel-internal-force', css: '[data-id=a2]{break-before:column}', body: '<div class="item" data-id="a"><div class="twenty" data-id="a1"></div><div class="twenty" data-id="a2"></div></div><div class="item" data-id="b"><div class="twenty" data-id="b1"></div><div class="twenty" data-id="b2"></div></div>'},
  {name: 'column-item-force', css: '.flex{flex-direction:column}[data-id=a],[data-id=b]{height:20px}[data-id=b]{break-before:column}', body: '<div class="item" data-id="a"></div><div class="item" data-id="b"></div>'},
  {name: 'non-top-row', css: '.probe:before{content:"";display:block;height:35px}.item{height:30px;break-inside:avoid}', body: '<div class="item" data-id="a"></div><div class="item" data-id="b"></div>'},
  {name: 'row-fixed-overflow', css: '[data-id=a]{height:20px}[data-id=b]{height:10px}[data-id=a1]{height:80px}', body: '<div class="item" data-id="a"><div data-id="a1"></div></div><div class="item" data-id="b"></div>'},
  {name: 'column-inner-force', css: '.flex{flex-direction:column}[data-id=a2]{break-before:column}[data-id=b]{height:10px}', body: '<div class="item" data-id="a"><div class="twenty" data-id="a1"></div><div class="twenty" data-id="a2"></div></div><div class="item" data-id="b"></div>'},
  {name: 'global-row-self-end', css: '.flex{height:130px;align-items:flex-end}.item{height:20px}', body: '<div class="item" data-id="a"></div>'},
  {name: 'global-column-justify-end', css: '.flex{height:130px;flex-direction:column;justify-content:flex-end}.item{height:20px}', body: '<div class="item" data-id="a"></div>'},
  {name: 'global-wrap-center', css: '.flex{height:130px;flex-wrap:wrap;align-content:center}.item{width:80px;height:20px}', body: '<div class="item" data-id="a"></div><div class="item" data-id="b"></div>'},
  {name: 'fragmented-leading-margin', css: '.flex{flex-direction:column}[data-id=a]{height:30px}[data-id=b]{height:20px;margin-top:40px;break-inside:avoid}', body: '<div class="item" data-id="a"></div><div class="item" data-id="b"></div>'},
  {name: 'fragmented-trailing-margin', css: '.flex{flex-direction:column}[data-id=a]{height:30px;margin-bottom:40px}[data-id=b]{height:20px;break-inside:avoid}', body: '<div class="item" data-id="a"></div><div class="item" data-id="b"></div>'},
  {name: 'suppressed-row-gap', css: '.flex{flex-wrap:wrap;row-gap:40px}.item{width:80px}[data-id=a]{height:30px}[data-id=b]{height:20px;break-inside:avoid}', body: '<div class="item" data-id="a"></div><div class="item" data-id="b"></div>'},
  {name: 'row-descendant-avoid-boundary', css: '.flex{flex-wrap:wrap}.item{width:100px}.item>div{break-inside:avoid}[data-id=c1]{break-before:avoid}', body: '<div class="item" data-id="a"><div style="height:10px"></div></div><div class="item" data-id="b"><div style="height:30px"></div></div><div class="item" data-id="c"><div data-id="c1" style="height:20px"></div></div>'},
  {name: 'column-descendant-avoid-boundary', css: '.flex{flex-direction:column}.item{width:100px}.item>div{break-inside:avoid}[data-id=c1]{break-before:avoid}', body: '<div class="item" data-id="a"><div style="height:10px"></div></div><div class="item" data-id="b"><div style="height:30px"></div></div><div class="item" data-id="c"><div data-id="c1" style="height:20px"></div></div>'},
  {name: 'column-first-active-boundary', css: '.probe:before{content:"";display:block;height:10px}.flex{flex-direction:column}.item{height:10px}[data-id=a]{visibility:collapse}[data-id=b]{break-before:column}', body: '<div class="item" data-id="a"></div><div class="item" data-id="b"></div>'},
  {name: 'column-last-active-boundary', css: '.flex{flex-direction:column}.item{height:10px}[data-id=a]{break-after:column}[data-id=b]{visibility:collapse}.probe:after{content:"";display:block;height:10px}', body: '<div class="item" data-id="a"></div><div class="item" data-id="b"></div>'},
  {name: 'column-independent-forced-line', css: '.flex{flex-direction:column;flex-wrap:wrap;height:40px;align-content:flex-start}.item{height:20px}[data-id=b]{break-before:column}', body: '<div class="item" data-id="a"></div><div class="item" data-id="b"></div><div class="item" data-id="c"></div><div class="item" data-id="d"></div>'},
  {name: 'column-independent-reversed-lines', css: '.flex{flex-direction:column;flex-wrap:wrap-reverse;height:40px;align-content:flex-start}.item{height:20px}[data-id=b]{break-before:column}', body: '<div class="item" data-id="a"></div><div class="item" data-id="b"></div><div class="item" data-id="c"></div><div class="item" data-id="d"></div>'}
];
window.addEventListener('DOMContentLoaded', () => {
  const results = [];
  for (const test of cases) {
    const host = document.createElement('div');
    host.innerHTML = `<style>${test.css}</style><div class="probe"><div class="flex" data-id="f">${test.body}</div></div>`;
    document.body.append(host);
    const origin = host.querySelector('.probe').getBoundingClientRect();
    const rects = Object.fromEntries([...host.querySelectorAll('[data-id]')].map(node => [node.dataset.id, [...node.getClientRects()].map(rect => ({x: rect.x-origin.x, y: rect.y-origin.y, width: rect.width, height: rect.height}))]));
    results.push({name: test.name, rects});
    host.remove();
  }
  window.probeResults = {mode: document.compatMode, userAgent: navigator.userAgent, results};
  const report = document.createElement('pre');
  report.textContent = JSON.stringify(window.probeResults, null, 2);
  document.body.append(report);
});
</script>
